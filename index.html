<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPS.CX - Position Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CPS">
  <meta name="theme-color" content="#0A0A0A">

  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════
     MAIN CALCULATOR
════════════════════════════════════════════════ -->
<div class="app-shell">

  <!-- Ambient background grain -->
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <!-- Iconsax Bold: Chart Square -->
        <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2h20v20H2z" rx="4" fill="var(--gold-primary)" opacity="0.12"/>
          <rect x="2" y="2" width="20" height="20" rx="4" stroke="var(--gold-primary)" stroke-width="1.5"/>
          <path d="M7 16l3-4 3 2 4-6" stroke="var(--gold-highlight)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="7" cy="16" r="1.2" fill="var(--gold-highlight)"/>
          <circle cx="17" cy="8" r="1.2" fill="var(--gold-highlight)"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">CPS</span>
          <span class="brand-sub">Position Calculator</span>
        </div>
      </div>

      <button class="settings-btn" onclick="openSettings()" aria-label="Settings">
        <!-- Iconsax Linear: Setting-2 -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- Divider -->
    <div class="header-rule"></div>

    <!-- Form -->
    <form class="calc-form" onsubmit="return false;">

      <!-- Row 1: Signal + Direction -->
      <div class="form-row form-row--2col">

        <div class="field-group">
          <label class="field-label">
            <!-- Iconsax Linear: Profile-2User -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 21a3 3 0 00-3-3H9a3 3 0 00-3 3"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Signal
          </label>
          <div class="select-wrap">
            <select id="signalType" onchange="onSignalTypeChange()">
              <option value="saltwayer">Saltwayer</option>
              <option value="neil">Neil</option>
              <option value="sherlock">Sherlock</option>
            </select>
            <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">
            <!-- Iconsax Linear: ArrowSwapHorizontal -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 8H8M20 8l-3-3M20 8l-3 3M4 16h12M4 16l3-3M4 16l3 3"/>
            </svg>
            Direction
          </label>
          <div class="direction-toggle" id="directionToggle">
            <button type="button" class="dir-btn dir-btn--long active" id="btnLong" onclick="setDirection('long')">
              <!-- Iconsax Linear: TrendUp -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
              Long
            </button>
            <button type="button" class="dir-btn dir-btn--short" id="btnShort" onclick="setDirection('short')">
              <!-- Iconsax Linear: TrendDown -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
              Short
            </button>
          </div>
          <!-- Hidden input carrying direction value -->
          <input type="hidden" id="direction" value="long">
        </div>

      </div>

      <!-- Row 2: DCA Mode -->
      <div class="field-group">
        <label class="field-label">
          <!-- Iconsax Linear: Repeat -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 014-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
          DCA Mode
        </label>
        <div class="dca-toggle">
          <button type="button" class="dca-btn active" id="dcaWithBtn" onclick="setDcaMode('with')">With DCA</button>
          <button type="button" class="dca-btn" id="dcaWithoutBtn" onclick="setDcaMode('without')">No DCA</button>
        </div>
        <input type="hidden" id="dcaMode" value="with">
      </div>

      <!-- Row 3: Balance + Risk -->
      <div class="form-row form-row--2col">

        <div class="field-group">
          <label class="field-label" for="balance">
            <!-- Iconsax Linear: Wallet -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12V7H5a2 2 0 010-4h14v4"/>
              <path d="M3 5v14a2 2 0 002 2h16v-5"/>
              <path d="M18 12a2 2 0 000 4h4v-4z"/>
            </svg>
            Balance
          </label>
          <div class="input-wrap">
            <span class="input-prefix">$</span>
            <input type="number" id="balance" placeholder="0.00" step="0.01" min="0" oninput="updatePnlPreview()">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="riskPercent">
            <!-- Iconsax Linear: Warning-2 -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Risk %
          </label>
          <div class="input-wrap">
            <input type="number" id="riskPercent" placeholder="5.0" step="0.1" min="0.1" max="100" oninput="updatePnlPreview()">
            <span class="input-suffix">%</span>
          </div>
        </div>

      </div>

      <!-- Row 4: Entry -->
      <div class="field-group">
        <label class="field-label" for="entry">
          <!-- Iconsax Linear: Login -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Entry Price
        </label>
        <div class="input-wrap">
          <input type="number" id="entry" step="0.0001" placeholder="0.0000" oninput="updatePnlPreview()">
        </div>
      </div>

      <!-- Row 5: DCA (conditionally shown) -->
      <div class="field-group dca-group" id="dcaGroup">
        <label class="field-label" for="dca">
          <!-- Iconsax Linear: Add-Square -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          DCA Price
        </label>
        <div class="input-wrap">
          <input type="number" id="dca" step="0.0001" placeholder="0.0000" oninput="updatePnlPreview()">
        </div>
      </div>

      <!-- Row 6: Stop Loss -->
      <div class="field-group">
        <label class="field-label" for="sl">
          <!-- Iconsax Linear: Shield-Cross -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
          </svg>
          Stop Loss
        </label>
        <div class="input-wrap">
          <input type="number" id="sl" step="0.0001" placeholder="0.0000" oninput="updatePnlPreview()">
        </div>
      </div>

      <!-- Live Preview -->
      <div class="pnl-preview" id="pnlPreview">
        <div class="pnl-row">
          <span class="pnl-label">Risk Amount</span>
          <span class="pnl-value pnl-loss" id="pnlRiskAmount">-</span>
        </div>
        <div class="pnl-divider"></div>
        <div class="pnl-row">
          <span class="pnl-label">Max Loss (SL Hit)</span>
          <span class="pnl-value pnl-loss" id="pnlWorstCase">-</span>
        </div>
        <div class="pnl-row">
          <span class="pnl-label">Break Even</span>
          <span class="pnl-value" id="pnlBreakEven">-</span>
        </div>
      </div>

      <!-- Calculate button -->
      <button type="button" class="calc-btn" onclick="calculate()">
        <!-- Iconsax Linear: Calculator -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="8" y1="6" x2="16" y2="6"/>
          <line x1="8" y1="10" x2="8" y2="10"/>
          <line x1="12" y1="10" x2="12" y2="10"/>
          <line x1="16" y1="10" x2="16" y2="10"/>
          <line x1="8" y1="14" x2="8" y2="14"/>
          <line x1="12" y1="14" x2="12" y2="14"/>
          <line x1="16" y1="14" x2="16" y2="14"/>
          <line x1="8" y1="18" x2="12" y2="18"/>
          <line x1="16" y1="18" x2="16" y2="18"/>
        </svg>
        Calculate Position Size
      </button>

      <!-- Result -->
      <div id="result" style="display:none;"></div>

    </form>

    <!-- Footer -->
    <footer class="app-footer">
      <span>CPS.CX</span>
      <span class="footer-dot">·</span>
      <span>v3.0</span>
    </footer>

  </div><!-- /container -->
</div><!-- /app-shell -->


<!-- ═══════════════════════════════════════════════
     SETTINGS MODAL
════════════════════════════════════════════════ -->
<div id="settingsModal" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-title">
        <!-- Iconsax Linear: Setting -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </div>
      <button class="modal-close" onclick="closeSettings()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="modal-tabs">
      <button class="tab-btn active" id="tabBtnAccounts" onclick="switchTab('accounts', this)">
        <!-- Iconsax Linear: Wallet-3 -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Accounts
      </button>
      <button class="tab-btn" id="tabBtnRisk" onclick="switchTab('risk', this)">
        <!-- Iconsax Linear: Percent-Square -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="15" x2="15" y2="9"/><circle cx="9.5" cy="9.5" r="0.5" fill="currentColor"/><circle cx="14.5" cy="14.5" r="0.5" fill="currentColor"/></svg>
        Risk Presets
      </button>
    </div>

    <!-- Accounts tab -->
    <div id="accountsTab" class="tab-content active">
      <div class="preset-form">
        <input type="text" id="presetName" placeholder="Preset name">
        <button type="button" class="preset-save-btn" onclick="saveAccountPreset()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Current Balance
        </button>
      </div>
      <div class="preset-list" id="accountPresetsList"></div>
    </div>

    <!-- Risk tab -->
    <div id="riskTab" class="tab-content">
      <div class="risk-form">

        <div class="risk-row">
          <div class="risk-info">
            <span class="risk-name">Saltwayer</span>
            <span class="risk-hint">Default multiplier: 2.5x DCA</span>
          </div>
          <div class="risk-input-wrap">
            <input type="number" id="riskSaltwayer" class="risk-input" step="0.1" min="0.1" max="100">
            <span class="risk-suffix">%</span>
          </div>
        </div>

        <div class="risk-row">
          <div class="risk-info">
            <span class="risk-name">Neil</span>
            <span class="risk-hint">Default multiplier: 2x DCA</span>
          </div>
          <div class="risk-input-wrap">
            <input type="number" id="riskNeil" class="risk-input" step="0.1" min="0.1" max="100">
            <span class="risk-suffix">%</span>
          </div>
        </div>

        <div class="risk-row">
          <div class="risk-info">
            <span class="risk-name">Sherlock</span>
            <span class="risk-hint">Equal split DCA strategy</span>
          </div>
          <div class="risk-input-wrap">
            <input type="number" id="riskSherlock" class="risk-input" step="0.1" min="0.1" max="100">
            <span class="risk-suffix">%</span>
          </div>
        </div>

        <button type="button" class="risk-save-btn" onclick="saveRiskPresets()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Risk Presets
        </button>
      </div>
    </div>

  </div>
</div>


<script>
// Direction toggle helpers (inline to avoid defer issues)
function setDirection(dir) {
  document.getElementById('direction').value = dir;
  document.getElementById('btnLong').classList.toggle('active', dir === 'long');
  document.getElementById('btnShort').classList.toggle('active', dir === 'short');
  if (typeof updatePnlPreview === 'function') updatePnlPreview();
}

function setDcaMode(mode) {
  document.getElementById('dcaMode').value = mode;
  document.getElementById('dcaWithBtn').classList.toggle('active', mode === 'with');
  document.getElementById('dcaWithoutBtn').classList.toggle('active', mode === 'without');
  if (typeof onDcaModeChange === 'function') onDcaModeChange();
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
}
</script>

<script src="main.js" defer></script>
</body>
</html>
